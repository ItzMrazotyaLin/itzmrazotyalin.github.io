<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое портфолио</title>
    <style>
        @font-face {
            font-family: 'Google Sans';
            src: url('/fonts/GoogleSans-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Google Sans';
            src: url('/fonts/GoogleSans-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'Google Sans';
            src: url('/fonts/GoogleSans-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
        }

        :root {
            --md-sys-color-background: #FDFBFF;
            --md-sys-color-on-background: #1A1C1E;
            --md-sys-color-surface: #FDFBFF;
            --md-sys-color-on-surface: #1A1C1E;
            --md-sys-color-surface-variant: #DFE2EB;
            --md-sys-color-on-surface-variant: #43474E;
            --md-sys-color-primary: #0061A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #D1E4FF;
            --md-sys-color-on-primary-container: #001D36;
            --md-sys-color-secondary-container: #D7E3F7;
            --md-sys-color-on-secondary-container: #101C2B;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --md-sys-color-background: #1A1C1E;
                --md-sys-color-on-background: #E2E2E6;
                --md-sys-color-surface: #1A1C1E;
                --md-sys-color-on-surface: #E2E2E6;
                --md-sys-color-surface-variant: #43474E;
                --md-sys-color-on-surface-variant: #C3C7CF;
                --md-sys-color-primary: #9ECAFF;
                --md-sys-color-on-primary: #003258;
                --md-sys-color-primary-container: #00497D;
                --md-sys-color-on-primary-container: #D1E4FF;
                --md-sys-color-secondary-container: #3B4858;
                --md-sys-color-on-secondary-container: #D7E3F7;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Google Sans', sans-serif;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-surface);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 3rem;
            margin-bottom: 5rem;
        }

        .avatar {
            width: 120px;
            height: 120px;
            background-color: var(--md-sys-color-primary-container);
            border-radius: 50%;
            margin-bottom: 1.5rem;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .hero p {
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--md-sys-color-on-surface-variant);
            max-width: 600px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--md-sys-color-surface-variant);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: background-color 0.2s ease;
        }

        .card:hover {
            background-color: color-mix(in srgb, var(--md-sys-color-surface-variant), var(--md-sys-color-on-surface-variant) 5%);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
        }

        .card-desc {
            font-size: 1rem;
            color: var(--md-sys-color-on-surface-variant);
            flex-grow: 1;
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn {
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0 1.5rem;
            height: 40px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease, background-color 0.2s ease;
        }

        .btn-primary {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }
        .btn-primary:hover {
            background-color: color-mix(in srgb, var(--md-sys-color-primary), white 10%);
        }

        .btn-tonal {
            background-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
        }
        .btn-tonal:hover {
            background-color: color-mix(in srgb, var(--md-sys-color-secondary-container), black 5%);
        }

        @media (prefers-color-scheme: dark) {
            .btn-primary:hover {
                background-color: color-mix(in srgb, var(--md-sys-color-primary), white 10%);
            }
            .btn-tonal:hover {
                background-color: color-mix(in srgb, var(--md-sys-color-secondary-container), white 5%);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="hero">
            <div class="avatar"><img src="/avatar.jpg" alt="Аватарка"></div>
            <h1>ItzMrazotyaLin</h1>
            <p>Создатель всякой ерунды | Любитель Frutiger Aero и Material You</p>
        </header>

        <main>
            <h2 class="section-title">Мои проекты</h2>
            
            <div class="projects-grid">
                
                <article class="card">
                    <h3 class="card-title">ClearifyOS</h3>
                    <p class="card-desc">Сборки Windows, сделанные для установки чистой системы без мусора и забивающих память программ.</p>
                    <div class="card-actions">
                        <a href="/ClearifyOS" class="btn btn-primary">Посмотреть</a>
                    </div>
                </article>

                <!-- <article class="card">
                    <h3 class="card-title">Text</h3>
                    <p class="card-desc">Desc</p>
                    <div class="card-actions">
                        <a href="#" class="btn btn-primary">Btn</a>
                    </div>
                </article>

                <article class="card">
                    <h3 class="card-title">Text/h3>
                    <p class="card-desc">Desc</p>
                    <div class="card-actions">
                        <a href="#" class="btn btn-primary">Btn</a>
                        <a href="#" class="btn btn-tonal">Btn2</a>
                    </div>
                </article> -->

            </div>
        </main>
    </div>

</body>
</html>
